global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: user-service
    static_configs:
      - targets: ["user-service:8081"]

  - job_name: event-service
    static_configs:
      - targets: ["event-service:8082"]

  - job_name: booking-service
    static_configs:
      - targets: ["booking-service:8083"]

  - job_name: analytics-service
    static_configs:
      - targets: ["analytics-service:8084"]

  - job_name: product-service
    static_configs:
      - targets: ["product-service:8086"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: kafka-connect-connectors
    metrics_path: /probe
    params:
      module: [kafka_connect_connector_running]
    static_configs:
      - targets:
          - http://kafka-connect:8083/connectors/user-service-outbox/status
          - http://kafka-connect:8083/connectors/booking-service-outbox/status
          - http://kafka-connect:8083/connectors/event-service-outbox/status
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        regex: '.*/connectors/(.+)/status'
        target_label: connector
      - target_label: __address__
        replacement: blackbox-exporter:9115
