modules:
  kafka_connect_connector_running:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp:
        - '"connector":\{"state":"RUNNING"'
        - '"tasks":\[\{"id":\d+,"state":"RUNNING"'
      fail_if_body_matches_regexp:
        - '"state":"(FAILED|PAUSED|UNASSIGNED)"'
