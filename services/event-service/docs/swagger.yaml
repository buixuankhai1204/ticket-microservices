basePath: /api/v1
definitions:
  http.CreateEventRequest:
    properties:
      description:
        type: string
      ends_at:
        type: string
      layout:
        $ref: '#/definitions/http.LayoutRequest'
      name:
        type: string
      starts_at:
        type: string
      venue:
        type: string
    type: object
  http.CreateEventResponse:
    properties:
      event:
        $ref: '#/definitions/http.EventResponse'
      seat_count:
        type: integer
    type: object
  http.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  http.EventResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      ends_at:
        type: string
      id:
        type: string
      name:
        type: string
      starts_at:
        type: string
      venue:
        type: string
    type: object
  http.ExceptionRequest:
    properties:
      number:
        type: string
      price_minor:
        type: integer
      remove:
        type: boolean
      row:
        type: string
      section:
        type: string
    type: object
  http.LayoutRequest:
    properties:
      exceptions:
        items:
          $ref: '#/definitions/http.ExceptionRequest'
        type: array
      sections:
        items:
          $ref: '#/definitions/http.SectionRequest'
        type: array
    type: object
  http.PaginatedEventsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.EventResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.PaginationMeta'
    type: object
  http.PaginatedSeatsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.SeatResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.PaginationMeta'
    type: object
  http.PaginationMeta:
    properties:
      has_more:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  http.SeatResponse:
    properties:
      event_id:
        type: string
      id:
        type: string
      number:
        type: string
      price_minor:
        type: integer
      row:
        type: string
      section:
        type: string
      status:
        type: string
    type: object
  http.SectionRequest:
    properties:
      name:
        type: string
      price_minor:
        type: integer
      rows:
        type: integer
      seats_per_row:
        type: integer
    type: object
info:
  contact: {}
  description: 'Event catalogue: browse events and their seat maps, and create new
    events with their seats.'
  title: event-service API
  version: "1.0"
paths:
  /events:
    get:
      description: Browse events newest first. Optionally restrict to upcoming events.
        Paginated with limit/offset.
      parameters:
      - description: only events that have not ended yet
        in: query
        name: upcoming
        type: boolean
      - description: page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: rows to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.PaginatedEventsResponse'
        "400":
          description: invalid limit/offset
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: List events
      tags:
      - events
    post:
      consumes:
      - application/json
      description: Creates a new event and expands the given seat layout (rectangular
        sections + per-seat exceptions) into its seat map, all in one transaction.
        A 100k-seat venue is a ~1KB body. The seat map is read back (paginated) via
        GET /api/v1/events/{eventID}/seats; this response carries only the seat count.
      parameters:
      - description: event fields plus the seat layout to expand
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.CreateEventResponse'
        "400":
          description: malformed body, invalid event, invalid or too-large layout,
            or no seats
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Create an event with its seat map
      tags:
      - events
  /events/{eventID}:
    get:
      description: Fetch a single event by its UUID.
      parameters:
      - description: event UUID
        in: path
        name: eventID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.EventResponse'
        "400":
          description: eventID is not a UUID
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: no such event
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Get one event
      tags:
      - events
  /events/{eventID}/seats:
    get:
      description: The seat map for one event, ordered by section/row/number. Paginated
        with limit/offset.
      parameters:
      - description: event UUID
        in: path
        name: eventID
        required: true
        type: string
      - description: page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: rows to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.PaginatedSeatsResponse'
        "400":
          description: eventID is not a UUID, or invalid limit/offset
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: no such event
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: List an event's seats
      tags:
      - events
swagger: "2.0"
