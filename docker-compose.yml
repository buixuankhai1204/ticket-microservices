services:
  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    # wal_level=logical is required for the Debezium connector to tail the
    # outbox_events WAL via a logical replication slot (see kafka-connect).
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    environment:
      POSTGRES_USER: ${USER_DB_USER:-user_service}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-user_service}
      POSTGRES_DB: ${USER_DB_NAME:-user_service}
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-user_service}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticket-network

  # Choreography saga bus. Single-node KRaft broker — no ZooKeeper. In-network
  # only (advertised as kafka:9092); use `docker compose exec kafka ...` to poke
  # it from the host.
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: kafka
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - ticket-network

  # One-shot: create the saga topics (auto-create is disabled above), then exit.
  # The outbox events land on <aggregate_type>.events — `user` -> user.events —
  # routed there by the Debezium Outbox Event Router SMT (see kafka-connect).
  kafka-init:
    image: bitnamilegacy/kafka:3.7
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command:
      - /bin/bash
      - -c
      - |
        set -e
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic ${KAFKA_USER_EVENTS_TOPIC:-user.events} --partitions 3 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic ${KAFKA_USER_EVENTS_TOPIC:-user.events}.dlq --partitions 1 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic ${KAFKA_BOOKING_EVENTS_TOPIC:-booking.events} --partitions 3 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic ${KAFKA_BOOKING_EVENTS_TOPIC:-booking.events}.dlq --partitions 1 --replication-factor 1
        echo "saga topics ready:"
        kafka-topics.sh --bootstrap-server kafka:9092 --list
    networks:
      - ticket-network

  # Kafka Connect running the Debezium PostgreSQL connector. It tails the
  # user_service DB's WAL for public.outbox_events and publishes each insert via
  # the Outbox Event Router SMT — this replaces the old in-process outbox relay.
  # The debezium/connect image bundles the Postgres connector + EventRouter SMT.
  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres-user:
        condition: service_healthy
      postgres-booking:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: ticket-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    healthcheck:
      # The debezium/connect image may ship curl or only wget — try both.
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null 2>&1 || wget -qO- http://localhost:8083/connectors >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - ticket-network

  # One-shot: register (or update) the Debezium connector, then exit. Treats an
  # existing connector (HTTP 409) as success so re-running compose is idempotent.
  connect-init:
    image: curlimages/curl:8.8.0
    container_name: connect-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./debezium:/debezium:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        for f in /debezium/user-service-outbox.json /debezium/booking-service-outbox.json; do
          code=$$(curl -s -o /tmp/resp -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data @$$f \
            http://kafka-connect:8083/connectors)
          echo "connector register ($$f) HTTP $$code"; cat /tmp/resp; echo
          case "$$code" in 200|201|409) echo "connector ready";; *) exit 1;; esac
        done
    networks:
      - ticket-network

  user-service:
    build:
      context: ./services/user-service
    container_name: user-service
    environment:
      DATABASE_URL: postgres://${USER_DB_USER:-user_service}:${USER_DB_PASSWORD:-user_service}@postgres-user:5432/${USER_DB_NAME:-user_service}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      DB_MAX_CONNECTIONS: ${USER_DB_MAX_CONNECTIONS:-10}
    ports:
        - "8081:8081"
    # No Kafka dependency any more: user-service publishes UserCreated purely by
    # writing outbox_events; the Debezium connector (kafka-connect) does the rest.
    depends_on:
      postgres-user:
        condition: service_healthy
    networks:
      - ticket-network

  postgres-analytics:
    image: postgres:16-alpine
    container_name: postgres-analytics
    environment:
      POSTGRES_USER: ${ANALYTICS_DB_USER:-analytics_service}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics_service}
      POSTGRES_DB: ${ANALYTICS_DB_NAME:-analytics_service}
    ports:
      - "5434:5432"
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_DB_USER:-analytics_service}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticket-network

  analytics-service:
    build:
      context: ./services/analytics-service
    container_name: analytics-service
    environment:
      DATABASE_URL: postgres://${ANALYTICS_DB_USER:-analytics_service}:${ANALYTICS_DB_PASSWORD:-analytics_service}@postgres-analytics:5432/${ANALYTICS_DB_NAME:-analytics_service}
      PORT: "8084"
      DB_MAX_CONNS: ${ANALYTICS_DB_MAX_CONNS:-20}
      KAFKA_BROKERS: kafka:9092
      KAFKA_USER_EVENTS_TOPIC: ${KAFKA_USER_EVENTS_TOPIC:-user.events}
      KAFKA_CONSUMER_MAX_ATTEMPTS: ${KAFKA_CONSUMER_MAX_ATTEMPTS:-5}
    ports:
      - "8084:8084"
    depends_on:
      postgres-analytics:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      connect-init:
        condition: service_completed_successfully
    networks:
      - ticket-network

  postgres-event:
    image: postgres:16-alpine
    container_name: postgres-event
    environment:
      POSTGRES_USER: ${EVENT_DB_USER:-event_service}
      POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD:-event_service}
      POSTGRES_DB: ${EVENT_DB_NAME:-event_service}
    ports:
      - "5435:5432"
    volumes:
      - postgres_event_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVENT_DB_USER:-event_service}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticket-network

  event-service:
    build:
      context: ./services/event-service
    container_name: event-service
    environment:
      DATABASE_URL: postgres://${EVENT_DB_USER:-event_service}:${EVENT_DB_PASSWORD:-event_service}@postgres-event:5432/${EVENT_DB_NAME:-event_service}
      PORT: "8082"
      DB_MAX_CONNS: ${EVENT_DB_MAX_CONNS:-20}
    ports:
      - "8082:8082"
    depends_on:
      postgres-event:
        condition: service_healthy
    networks:
      - ticket-network

  postgres-booking:
    image: postgres:16-alpine
    container_name: postgres-booking
    # wal_level=logical: booking-service publishes seat-reservation saga events
    # via the Debezium CDC outbox (docs/sagas/seat-reservation.md §9), which
    # tails this DB's WAL through a logical replication slot. Set now so the
    # connector can be registered later without a DB restart.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    environment:
      POSTGRES_USER: ${BOOKING_DB_USER:-booking_service}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_service}
      POSTGRES_DB: ${BOOKING_DB_NAME:-booking_service}
    ports:
      - "5436:5432"
    volumes:
      - postgres_booking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOKING_DB_USER:-booking_service}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticket-network

  booking-service:
    build:
      context: ./services/booking-service
    container_name: booking-service
    environment:
      DATABASE_URL: postgres://${BOOKING_DB_USER:-booking_service}:${BOOKING_DB_PASSWORD:-booking_service}@postgres-booking:5432/${BOOKING_DB_NAME:-booking_service}
      PORT: "8083"
      DB_MAX_CONNECTIONS: ${BOOKING_DB_MAX_CONNECTIONS:-10}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
    ports:
      - "8085:8083"
    depends_on:
      postgres-booking:
        condition: service_healthy
    networks:
      - ticket-network

  kong:
    image: kong:3.6
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - user-service
      - analytics-service
      - event-service
      - booking-service
    networks:
      - ticket-network

volumes:
  postgres_user_data:
  postgres_analytics_data:
  postgres_event_data:
  postgres_booking_data:

networks:
  ticket-network:
    driver: bridge
