openapi: 3.0.3
info:
  title: user-service API
  description: >
    Authentication and user-profile API for the ticket booking platform.
    Reached exclusively through the Kong API Gateway; the service itself is
    not directly addressable by clients. Implemented in Rust (axum) under
    `services/user-service`.
  version: "1.0.0"
servers:
  - url: http://localhost:8000
    description: Kong API Gateway (local docker-compose)

tags:
  - name: auth
    description: Registration and login, routed via Kong's `/api/v1/auth` prefix.
  - name: users
    description: User profile lookup, routed via Kong's `/api/v1/users` prefix.

paths:
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      description: >
        Rate limit: 60 requests/minute per the `auth-routes` Kong route
        (local policy). No JWT required.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Email already registered or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (60 req/min)
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in and obtain a JWT
      description: >
        Rate limit: 60 requests/minute per the `auth-routes` Kong route
        (local policy). No JWT required to call; returns one on success.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (60 req/min)
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{id}:
    get:
      tags: [users]
      summary: Get a user's profile by ID
      description: >
        Rate limit: 100 requests/minute per the `user-profile-routes` Kong
        route (local policy). Requires a JWT bearer token; Kong's `jwt`
        plugin verifies the `exp` claim before forwarding the request.
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or invalid JWT
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (100 req/min)
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    UserResponse:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
